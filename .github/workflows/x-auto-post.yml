name: X Auto Post

# --- 停止中 (2026-08-25 KT+Claude) ---
# X API v2 が 402 credits depleted で投稿を拒否するようになったため、cron を停止。
# X Basic プラン ($200/月) にアップグレードすれば再稼働可能。
# 手動投稿は Actions タブの "Run workflow" ボタンから随時実行可能(workflow_dispatch を残してある)。

on:
  # schedule 停止中(再開する場合は以下のコメントを外す)
  # - cron: '0 3 * * *'         # 毎日 12:00 JST
  # - cron: '0 11 * * 2,3,4'    # 火水木 20:00 JST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: x-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npm run post:x

      - name: Commit updated post history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/social-history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update social post history [skip ci]"
            git push
          else
            echo "No history changes to commit."
          fi
